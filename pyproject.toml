[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todoist-mcp"
version = "0.1.0"
description = "Model Context Protocol server that connects Claude (and other MCP clients) to Todoist."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lucas Salvador", email = "lucas.gf.salvador@gmail.com" }]
keywords = ["mcp", "todoist", "claude", "anthropic", "llm", "tasks", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/lucasgfsvd/todoist-mcp"
Repository = "https://github.com/lucasgfsvd/todoist-mcp"
Issues = "https://github.com/lucasgfsvd/todoist-mcp/issues"

[project.scripts]
todoist-mcp = "todoist_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["todoist_mcp"]
